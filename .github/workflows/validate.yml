name: Validate Agency Platform V2

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  platform-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Run governed repository, contract and workflow validation
        run: python tooling/validation/validate_all.py
