name: Validate Agency Platform V2

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate governed repository structure
        run: python tooling/validation/validate_repository.py
