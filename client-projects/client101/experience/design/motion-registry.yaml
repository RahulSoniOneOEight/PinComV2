motions:
- semantic_id: commerce.add-to-cart
  trigger: tap
  effect: scale
  duration_ms: 120
  curve: easeOut
  flutter:
    runtime: flutter_animate
  web:
    runtime: Motion
  from: 1.0
  to: 0.96
- semantic_id: navigation.page-enter
  trigger: route-enter
  effect: fade-slide
  duration_ms: 200
  curve: easeOut
  flutter:
    runtime: flutter_animate
  web:
    runtime: Motion
  from: 0
  to: 1
- semantic_id: navigation.tab-switch
  trigger: tab-change
  effect: fade
  duration_ms: 150
  curve: easeOut
  flutter:
    runtime: flutter_animate
  web:
    runtime: Motion
  from: 0
  to: 1
- semantic_id: overlay.modal-enter
  trigger: modal-open
  effect: scale-fade
  duration_ms: 200
  curve: easeOut
  flutter:
    runtime: flutter_animate
  web:
    runtime: Motion
  from: 0.95
  to: 1
- semantic_id: list.item-stagger
  trigger: list-load
  effect: fade-slide
  duration_ms: 320
  curve: easeOut
  flutter:
    runtime: flutter_animate
  web:
    runtime: Motion
  from: 0
  to: 1
- semantic_id: feedback.loading-pulse
  trigger: loading
  effect: pulse
  duration_ms: 800
  curve: easeInOut
  flutter:
    runtime: flutter_animate
  web:
    runtime: Motion
- semantic_id: feedback.error-shake
  trigger: error
  effect: shake
  duration_ms: 400
  curve: easeInOut
  flutter:
    runtime: flutter_animate
  web:
    runtime: Motion
- semantic_id: feedback.success-rich
  trigger: success
  effect: rich-animation
  duration_ms: 800
  curve: easeOut
  flutter:
    runtime: Rive/Lottie
  web:
    runtime: Rive/Lottie
status: review-ready
