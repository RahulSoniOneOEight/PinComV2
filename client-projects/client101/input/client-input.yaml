marketplace_requirements:
  seller_onboarding: mobile number and OTP account creation followed by progressive seller profile, verification, approval and activation
  seller_kyc: seller owns profile data entry, document upload and resubmission; the prototype superadmin reviews and approves submissions; exact production legal document checklist remains TBD and must not be hard-coded
  catalogue_ownership: seller owns seller-specific product, listing and offer creation and updates; the prototype superadmin reviews governed changes; platform owns canonical catalogue, taxonomy, attributes, governance, association and search representation
  inventory_ownership: seller maintains seller-owned stock; platform or warehouse maintains managed stock; platform aggregates customer-facing availability
  fulfilment_ownership: seller or warehouse performs physical fulfilment; platform orchestrates splits, shipments, tracking and consolidated delivery status
  returns_ownership: platform owns unified return and refund orchestration; seller processes seller-specific acceptance where applicable
  customer_support_ownership: platform owns primary support and orchestration; seller-specific cases may be routed or escalated to sellers
  commission_model: configurable percentage; prototype default is governed as an assumption
  settlement_cycle: configurable; prototype T+3 default is governed as an assumption
  payout_model: configurable seller payable after commission, gateway fees, logistics adjustments, seller-funded promotions, refunds, returns, chargebacks and other adjustments
  dispute_model: seller-specific resolution with marketplace admin oversight
  responsibility_model: mixed and configurable
  settlement_capabilities:
    - eligibility
    - holds
    - payout-status
    - adjustment-ledger
    - reconciliation
    - refund-reversals
    - failed-payout-retry
    - settlement-statements
