assumptions:
  - Prototype provider defaults are Razorpay, Shiprocket and Meta WhatsApp Cloud API; all remain configurable and do not constitute production approval.
  - Seller commission remains configurable and uses 10 percent only as a prototype default, not a production rule.
  - Settlement timing remains configurable and uses T+3 days only as a prototype default, not a production rule.
  - Standard configurable prototype values may be used for B2B credit approval and partial payment until production rules are confirmed.
  - Prototype competitive pricing uses clearly labelled synthetic data points for marketplace and competitor prices, source labels, observation timestamps and freshness states; no live competitor collection occurs.
  - Competitive pricing exposes an extension interface only; production collection remains disabled until an approved legal and operational policy exists.
  - Prototype location and address fixtures focus on representative Tier-2 Indian cities and remain synthetic; they do not approve the production rollout city list.
  - Sellers own prototype KYC submission and resubmission plus product, listing, offer and stock updates; one prototype superadmin performs review and approval.
  - The BuildKart prototype uses one superadmin for prototype approvals only; production approval roles and separation of duties remain subject to human approval.
  - Configurable load-test assumptions may be used for prototype testing until peak TPS and concurrent-user targets are approved; they are not client-approved SLAs.
  - High risk profile is assigned because the scope includes marketplace finance, seller settlements, B2B credit and ERP accounting.
  - GitHub URLs remain provenance metadata in onboarding; reference repositories never override Client 101 decisions or become dependencies without governed evaluation.
open_questions:
  - Which states and cities are included in the initial India launch?
  - What exact peak TPS and concurrent-user targets should be approved?
  - Which payment, logistics, communication and support providers are approved for production?
  - What exact legal KYC document checklist and regulatory policy apply to seller verification?
  - What approved policy governs competitive-price sources, collection mechanism, legal terms, product matching, attribution, freshness, rate limits, retention and audit evidence?
  - What contractual uptime and response-time SLAs, RTO, RPO, retention periods, privacy policy and data-classification policy should be approved?
  - Who are the named individuals for the mandatory business, design, technology, finance, UAT and production-release approval roles?
