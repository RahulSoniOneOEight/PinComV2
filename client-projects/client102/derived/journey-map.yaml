- id: credit-order
  actor: b2b-buyer
  objective: buyer places an order on credit with approval
- id: seller-onboarding
  actor: seller
  objective: seller registers and passes KYC
- id: seller-catalogue
  actor: seller
  objective: seller publishes products, pricing and stock
- id: marketplace-order
  actor: operator
  objective: platform receives and allocates a marketplace order
- id: seller-fulfilment
  actor: seller
  objective: seller picks, packs and dispatches
- id: seller-return
  actor: seller
  objective: seller receives and settles a returned item
- id: seller-settlement
