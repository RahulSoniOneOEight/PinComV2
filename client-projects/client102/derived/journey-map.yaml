journeys:
- id: browse-to-buy
  actor: customer
  objective: consumer discovers products and completes a purchase
- id: search-to-buy
  actor: customer
  objective: high-intent consumer searches and purchases
- id: order-tracking
  actor: customer
  objective: consumer follows a shipment to delivery
- id: return-refund
  actor: customer
  objective: consumer requests a return and tracks the refund
- id: quote-to-order
