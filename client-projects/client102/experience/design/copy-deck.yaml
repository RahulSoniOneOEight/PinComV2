error_catalogue:
- id: ERR-network-001
  cause: network-unreachable
  message_en: Check your connection and try again.
  recovery_action: Retry
  class: transient
- id: ERR-payment-002
  cause: payment-declined
  message_en: Your payment was declined. Try another method.
  recovery_action: Change payment method
  class: blocking
- id: ERR-payment-003
  cause: payment-timeout
  message_en: The payment did not confirm. No money was deducted.
  recovery_action: Check order status
  class: blocking
- id: ERR-otp-004
  cause: otp-invalid
  message_en: That OTP is not correct. {n} attempts left.
  recovery_action: Re-enter OTP
  class: recoverable
- id: ERR-otp-005
  cause: otp-expired
  message_en: The OTP expired. Request a new one.
  recovery_action: Resend OTP
  class: recoverable
- id: ERR-cart-006
  cause: item-unavailable
  message_en: An item in your cart is no longer available.
  recovery_action: Review cart
  class: recoverable
- id: ERR-cart-007
  cause: price-changed
  message_en: The price of an item changed since you added it.
  recovery_action: Review cart
  class: recoverable
- id: ERR-stock-008
  cause: insufficient-stock
  message_en: Only {n} units are available.
  recovery_action: Reduce quantity
  class: recoverable
- id: ERR-auth-009
  cause: session-expired
  message_en: Your session expired. Please sign in again.
  recovery_action: Sign in
  class: blocking
- id: ERR-trade-010
  cause: credit-limit-exceeded
  message_en: This order exceeds the available credit limit.
  recovery_action: Request approval
  class: blocking
- id: ERR-trade-011
  cause: moq-not-met
  message_en: Minimum order quantity for this item is {n}.
  recovery_action: Adjust quantity
  class: recoverable
- id: ERR-trade-012
  cause: approval-pending
  message_en: This order needs approval before it is placed.
  recovery_action: Track approval
  class: pending
- id: ERR-upload-013
  cause: list-upload-failed
  message_en: We could not read that file. Use the template.
  recovery_action: Download template
  class: recoverable
- id: ERR-generic-999
  cause: unexpected
  message_en: Something went wrong on our side.
  recovery_action: Try again
  class: transient
status: review-ready
