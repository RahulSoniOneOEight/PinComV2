client_id: client102
languages:
  primary: en
  secondary: hi
tone:
  principles:
  - plain, everyday language a first-time buyer understands
  - say what happened and what to do next; never blame the user
  - numbers and money always shown in Indian grouping with the rupee sign
  - no exclamation marks in errors; no jargon in B2B copy for tier-2 buyers
  address:
    en: second person, informal
    hi: आप (respectful)
formatting:
  currency: ₹1,120 — Indian digit grouping, symbol before amount, no decimals on whole
    rupees
  quantity: 1 pc / 10 pcs
  date: DD MMM YYYY
  numbering: Western Arabic numerals in both languages
  minimum_text_size: 11px
