rules:
- id: RULE-accent-not-button-surface
  statement: 'action.selected (#88BDF2) and content.muted (#55708A) are accents, selected
    surfaces and decorative fills. Never place small white text on #88BDF2 (measured
    1.98:1). Selected surfaces take content.on-selected (#384959, 4.68:1).

    '
  measured:
    white_on_88BDF2: 1.98
    on_selected_on_88BDF2: 4.68
- id: RULE-primary-action-contrast
  statement: Primary actions use action.primary (Storm Navy) with content.inverse.
    9.27:1.
- id: RULE-control-boundary
  statement: 'Decorative dividers may use border.default/border.strong. Input and
    control boundaries must use border.control (#748EAA) to satisfy WCAG 1.4.11 (3:1).

    '
  measured:
    control_vs_page: 3.24
    control_vs_raised: 3.39
    control_vs_interactive: 3.03
- id: RULE-focus-visible
  statement: Every interactive element shows a visible focus ring using border.focus
    (3.49:1 vs page).
- id: RULE-disabled-exempt
  statement: action.disabled (#DFE7F0) is below 3:1 by design; inactive components
    are exempt from WCAG contrast. Do not use it for enabled content.
- id: RULE-state-coverage
  statement: Every data-backed component defines default, loading, empty, error and
    success states before approval.
- id: RULE-semantic-only
  statement: Component code references semantic roles, never raw hex. Theme changes
    must not require component edits.
- id: RULE-contrast-gate
  statement: Any new colour pair is added only after theme_compiler contrast checks
    pass at 4.5:1 text / 3:1 non-text.
- id: RULE-secondary-token-surfaces
  statement: 'content.secondary must not be used on surface.accent. The original #526D82
    measured 3.83:1 there, failing WCAG AA; it is now #456079 (4.62:1). Every text
    token must be validated against every surface it is used on, not only the neutral
    ones.'
  measured:
    old_on_accent: 3.83
    new_on_accent: 4.62
    new_on_interactive: 5.86
    new_on_page: 5.42
