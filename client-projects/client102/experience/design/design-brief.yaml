decoration_rules:
  watermarks:
  - watermark.draft-not-approved
  - watermark.sample-imagery
  - watermark.seller-supplied
  patterns:
  - pattern.campaign-background
  - pattern.merchandising-frame
  rules:
  - 'R-watermark-draft: any unapproved revision carries watermark.draft-not-approved'
  - 'R-watermark-sample: placeholders and unlicensed stock carry watermark.sample-imagery'
  - 'R-pattern-restraint: background patterns stay at or below 0.08 opacity and never
    reduce text contrast below 4.5:1'
  - 'R-image-treatment: every media slot declares aspect, fit and focal point in the
    crop rules before build'
  - 'R-placeholder-honesty: a placeholder watermark may never reach a client review
    or production build'
motion_registry_ref: experience/design/motion-registry.yaml
interaction_rules:
  focus:
  - 'R-focus-visible: every interactive element shows border.focus (3.49:1) on keyboard
    focus; never remove the outline without a replacement'
  - 'R-focus-order: keyboard order matches visual order on every screen'
  - 'R-focus-trap: modals and sheets trap focus and return it to the trigger on close'
  reduced_motion:
  - 'R-reduced-motion: every motion in the registry declares a reduced-motion alternative;
    durations collapse to 0ms'
  - 'R-motion-preserves: under reduced motion, focus visibility and state-change clarity
    must still be conveyed'
  - 'R-motion-purpose: motion must explain state or hierarchy; decoration-only motion
    is forbidden on operational surfaces'
  states:
  - 'R-state-coverage: every data-backed component defines default, loading, empty,
    error and success before approval'
  - 'R-scrim-contrast: scrims use opacity.scrim over content.primary so modal content
    keeps 4.5:1 against the scrim edge'
component_ref_enrichment:
  why: Platform attribution is derived from the design IR. Thin component_refs on
    the customer-app and b2b nodes had wrongly marked shared components (bottom nav,
    toast, segmented control) as web-only.
  method: node action/capability matched against explicit rules; app bar added to
    every phone node
  overrides:
    control.segmented: used on S2 · Login (Consumer/B2B segmented control); the journey
      IR has no auth journey
    input.text-field: used on S1 Onboarding and S2 Login, which the journey IR does
      not model
    action.button: primary CTAs on every Flutter screen
  remaining_gap: the journey IR models no authentication journey, so auth screens
    are attributed by override rather than by the graph
