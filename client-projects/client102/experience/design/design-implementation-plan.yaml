gates:
- design_gate
- visual_qa
- experience_approval
- visual_baselines
gate_status:
  design_gate: blocked
  design_gate_blockers: 10
  design_gate_checks:
    surfaces: false
    journeys: false
    design_ir: false
    design_source: true
    visual_qa: false
  visual_qa: not-run
  experience_approval: absent
  visual_baselines: recorded
gate_note: Implementation must not start until the hard design gate is clean. AGENTS.md
  rule 22 forbids exporting design directly into production code (Design IR plus the
  semantic registries mediate it), and rule 24 makes drift from the approved revision
  blocking. The ui-builder contract requires design_gate to pass before client-facing
  code is generated.
preconditions:
- 'hard design gate clean: immutable experience approval plus a review package whose
  manifest and observed revisions match'
- design IR covering every journey in the journey graph
- visual QA records passing for all 8 required surfaces
- ui implementation registry mapping every semantic component to a Flutter and web
  component
status: blocked
