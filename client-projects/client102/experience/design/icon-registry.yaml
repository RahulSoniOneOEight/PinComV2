policy:
  primary: Phosphor
  secondary: Iconoir
  fallback: Hugeicons
  rationale: Matches the governed platform icon policy. Primary is Phosphor; Iconoir
    is the secondary substitute; Hugeicons is the fallback. All entries below were
    verified to resolve in OpenPencil as ph:<name> via search_icons.
  weights:
    rest: regular
    selected: fill
    emphasis: bold
  sizes:
    inline: 16
    control: 20
    nav: 24
    illustrative: 48
