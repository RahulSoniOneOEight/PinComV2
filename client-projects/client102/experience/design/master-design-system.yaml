system_id: client102-master-design-system
client_id: client102
tokens:
  color:
    surface.page: '{theme.surface.page}'
    surface.raised: '{theme.surface.raised}'
    surface.interactive: '{theme.surface.interactive}'
    surface.accent: '{theme.surface.accent}'
    content.primary: '{theme.content.primary}'
    content.secondary: '{theme.content.secondary}'
    content.muted: '{theme.content.muted}'
    content.inverse: '{theme.content.inverse}'
    content.on-selected: '{theme.content.on-selected}'
    action.primary: '{theme.action.primary}'
    action.hover: '{theme.action.hover}'
    action.secondary: '{theme.action.secondary}'
    action.selected: '{theme.action.selected}'
    action.disabled: '{theme.action.disabled}'
    action.destructive: '{theme.action.destructive}'
    border.default: '{theme.border.default}'
    border.strong: '{theme.border.strong}'
    border.control: '{theme.border.control}'
    border.focus: '{theme.border.focus}'
    nav.active: '{theme.nav.active}'
    feedback.success: '{theme.feedback.success}'
    feedback.warning: '{theme.feedback.warning}'
    feedback.error: '{theme.feedback.error}'
    feedback.info: '{theme.feedback.info}'
  typography:
    family: Hind
    fallback:
    - Noto Sans Devanagari
    - system-ui
    - sans-serif
    numerals: proportional-lining
    scale:
      display:
        size: 24
        weight: 700
        line_height: 1.25
      title:
        size: 20
        weight: 700
        line_height: 1.3
      heading:
        size: 16
        weight: 600
        line_height: 1.4
      subheading:
        size: 14
        weight: 600
        line_height: 1.4
      body:
        size: 14
        weight: 400
        line_height: 1.5
      bodyStrong:
        size: 14
        weight: 700
        line_height: 1.5
      label:
        size: 12
        weight: 600
        line_height: 1.35
      micro:
        size: 11
        weight: 600
        line_height: 1.3
    weights:
    - 400
    - 600
    - 700
    sizes:
    - 11
    - 12
    - 14
    - 16
    - 20
    - 24
  spacing:
    xs: 4
    sm: 8
    md: 12
    lg: 16
    xl: 24
    2xl: 32
  radius:
    sm: 6
    md: 8
    lg: 12
    pill: 999
  elevation:
    none: 0
    raised: 1
    overlay: 3
    values:
      raised: '0 1 3 #38495914 (light) / 0 1 3 #00000066 (dark)'
      overlay: '0 8 24 #38495929 (light) / 0 8 24 #00000099 (dark)'
  motion:
    instant:
      duration_ms: 80
      curve: standard
    fast:
      duration_ms: 140
      curve: standard
    standard:
      duration_ms: 220
      curve: emphasized
    slow:
      duration_ms: 320
      curve: emphasized
    page:
      duration_ms: 380
      curve: emphasized
    reduced_motion:
      duration_ms: 0
      preserve:
      - focus-visibility
      - state-change-clarity
    note: aligned to design-intelligence/motion-tokens.yaml
  z_index:
    base: 0
    sticky: 100
    bottom_nav: 200
    sheet: 300
    modal: 400
    toast: 500
  opacity:
    disabled: 0.4
    scrim: 0.45
    muted: 0.7
breakpoints:
  phone: 0
  tablet: 768
  desktop: 1024
  wide: 1440
themes:
- light
status: review-ready
resolved_theme_ref: experience/design/theme-resolution.yaml
resolved_semantic_roles:
  surface.page: '#F7FAFE'
  surface.raised: '#FFFFFF'
  surface.interactive: '#EAF3FE'
  surface.accent: '#BDDCFC'
  content.primary: '#384959'
  content.secondary: '#526D82'
  content.muted: '#55708A'
  content.inverse: '#FFFFFF'
  content.on-selected: '#384959'
  action.primary: '#384959'
  action.hover: '#273746'
  action.secondary: '#BDDCFC'
  action.selected: '#88BDF2'
  action.disabled: '#DFE7F0'
  action.destructive: '#B42318'
  border.default: '#DCE6F0'
  border.strong: '#9CB2CA'
  border.control: '#748EAA'
  border.focus: '#6A89A7'
  nav.active: '#384959'
  feedback.success: '#067647'
  feedback.warning: '#9A610A'
  feedback.error: '#B42318'
  feedback.info: '#175CD3'
