experience_requirements:
  - requirement_id: REQ-cart-merchandising
    statement: Show related/complementary products based on products already in the cart before checkout completion, with quick-add where appropriate.
    ux_impact: true
    source_refs: [SRC-001, SRC-002]
    requested_surfaces: [customer-app, web-store, b2b]
    requested_screens: [cart, checkout]
    requested_components: [related-products-rail, product-card, cart-line, quick-add]
    required_states: [default, empty, loading]
  - requirement_id: REQ-external-price-comparison
    statement: Product tiles/PDP may show comparable observed Amazon/Flipkart prices, clearly distinguished from own selling price with source/freshness context.
    ux_impact: true
    source_refs: [SRC-001]
    requested_surfaces: [customer-app, web-store, b2b]
    requested_screens: [product-list, product-detail]
    requested_components: [product-card, price-comparison, competitor-price]
    required_states: [default, stale-price, unavailable]
  - requirement_id: REQ-project-site-purchasing
    statement: A B2B account can manage multiple projects/sites and delivery locations, build project-specific material lists/carts/orders, and reorder per project.
    ux_impact: true
    source_refs: [SRC-002]
    requested_surfaces: [b2b]
    requested_screens: [project-list, project-detail, material-list]
    requested_components: [project-card, project-selector, material-list]
    required_states: [default, empty, loading]
  - requirement_id: REQ-competitor-price-data
    statement: Amazon/Flipkart observed prices are external inputs supplied by a crawler/price-intelligence process; UX consumes normalized competitor-price data (marketplace, observed price, freshness timestamp).
    ux_impact: false
    source_refs: [SRC-001]
  - requirement_id: REQ-configurable-recommendations
    statement: Cart/checkout recommendation logic must remain configurable rather than hard-coded into the UI.
    ux_impact: false
    source_refs: [SRC-001]
