goals:
  - Unified B2C/D2C multi-seller marketplace with a simple consumer experience across sellers and categories
  - B2B procurement marketplace (RFQ, bulk/trade pricing, credit, repeat ordering, business accounts)
  - Integrated commerce operations (orders, inventory, fulfilment, finance/settlement, ERP)
  - Tier-2-friendly experience (mobile-first, UPI/COD, assisted/WhatsApp commerce, data-light, localized)
  - Automation and management visibility (lifecycle/operations automations and functional dashboards)
