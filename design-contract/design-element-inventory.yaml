version: 1
id: design-element-inventory
title: Design Element Taxonomy
purpose: Canonical list of design element families every client project must evaluate
  before its design can be reviewed or approved. A client project instantiates this
  taxonomy at experience/design/design-element-inventory.yaml and reports a status
  plus evidence per element.
levels:
- id: F
  name: Foundations (design decisions, no visible artifact)
- id: P
  name: Primitives (atoms)
- id: C
  name: Components (molecules)
- id: T
  name: Patterns (organisms)
- id: L
  name: Layouts & templates
- id: X
  name: Cross-cutting overlays & decoration
- id: N
  name: Content & language
- id: A
  name: Accessibility
- id: G
  name: Governance & evidence
statuses:
- done
- partial
- missing
- not-applicable
evaluations:
- required
- conditional
- optional
evaluation_rules:
  required: Must reach status done before experience approval.
  conditional: Required only when the client scope includes the capability; otherwise
    not-applicable with a reason.
  optional: Recommended; may remain missing with a recorded decision.
