services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pincommerce
      POSTGRES_USER: pincommerce
      POSTGRES_PASSWORD: pincommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pincommerce -d pincommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: dev-master-key
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data

volumes:
  postgres-data:
  meili-data:
